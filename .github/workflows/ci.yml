name: CI

# Two jobs, because the two platforms answer different questions.
#
# Windows checks out in CRLF, as most people who clone this will, and it is the one place a
# run can be asked to reproduce the commit byte for byte: a CRLF clone once rewrote six
# tracked files and failed nothing (CLAUDE.md 6). It also publishes the native library the
# way build.ps1 does, which is what lets test 75 read a real export table.
#
# Linux checks out in LF, links natively with clang, compresses with the system zlib - and
# links the CLI ahead of time, which is what ships, so trimming and AOT warnings fail here
# rather than on release day.
#
# Both run the whole suite with veraPDF installed and refuse a skip they did not expect, run
# every harness over every face, and set the native library against the CLI by the document
# it writes, never by its return code (CLAUDE.md 8).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows, CRLF checkout
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      # Said rather than left to the image: the tree check at the end is worth something
      # only on the checkout that once broke it.
      - name: Check out in CRLF
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install veraPDF
        run: .github/scripts/install-verapdf.sh

      # Cold by construction, so a warning cannot hide behind an assembly nothing rebuilt
      # (CLAUDE.md 4).
      - name: Build
        run: dotnet build frisket.slnx -c Release -warnaserror --nologo

      - name: Publish the native library
        shell: pwsh
        run: ./bindings/native/build.ps1 -Target win-x64

      - name: Test
        env:
          EXPECTED_SKIPS: ''
        run: .github/scripts/run-tests.sh

      - name: Harnesses
        run: .github/scripts/run-harnesses.sh

      - name: The native library writes what the CLI writes
        run: >
          python bindings/native/check-against-cli.py
          bindings/native/bin/win-x64/publish/frisket.dll
          apps/cli/bin/Release/net10.0/Frisket.Cli.dll

      - name: Pack
        run: |
          dotnet pack frisket.slnx -c Release --no-build -warnaserror --nologo -o "$RUNNER_TEMP/packages"
          ls "$RUNNER_TEMP/packages"

      - name: The run reproduced the commit
        run: .github/scripts/check-tree.sh content

  linux:
    name: Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # NativeAOT links with clang; the zlib headers are not guaranteed on the image.
      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Install veraPDF
        run: .github/scripts/install-verapdf.sh

      - name: Build
        run: dotnet build frisket.slnx -c Release -warnaserror --nologo

      - name: Publish the native library
        run: bindings/native/build.sh linux-x64

      # Test 75 reads PE export tables, and what Linux publishes is an ELF: it says so and
      # skips, which is a limit of that test and the one skip allowed here.
      - name: Test
        env:
          EXPECTED_SKIPS: Test75_PublishedLibrariesExportWhatTheHeaderDeclares
        run: .github/scripts/run-tests.sh

      - name: Harnesses
        run: .github/scripts/run-harnesses.sh

      - name: The native library writes what the CLI writes
        run: >
          python3 bindings/native/check-against-cli.py
          bindings/native/bin/Release/net10.0/linux-x64/publish/libfrisket.so
          apps/cli/bin/Release/net10.0/Frisket.Cli.dll

      # The CLI as it ships: linked ahead of time, then asked for the same invoice as the
      # managed build and held to the same document.
      - name: The CLI linked ahead of time
        run: |
          set -euo pipefail
          dotnet publish apps/cli/Frisket.Cli.csproj -c Release -r linux-x64 -warnaserror --nologo -o "$RUNNER_TEMP/cli"
          ls -l "$RUNNER_TEMP/cli/Frisket.Cli"
          args=(render -t tests/output/acme/acme.template.json -d tests/output/acme/acme.data.json --format pdf)
          "$RUNNER_TEMP/cli/Frisket.Cli" "${args[@]}" -o "$RUNNER_TEMP/aot"
          dotnet apps/cli/bin/Release/net10.0/Frisket.Cli.dll "${args[@]}" -o "$RUNNER_TEMP/managed"
          python3 tools/compare-pdf.py "$RUNNER_TEMP/aot/acme.data.pdf" "$RUNNER_TEMP/managed/acme.data.pdf"

      - name: Nothing written that nobody committed
        run: .github/scripts/check-tree.sh untracked
