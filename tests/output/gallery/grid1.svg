<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>Contact sheet - page 1</title>
  <style>text{white-space:pre;font-kerning:none;font-variant-ligatures:none}</style>
  <rect x="0" y="0" width="210" height="297" fill="#FFFFFF"/>
  <text x="15" y="21" font-family="Elms Sans" font-size="6.857" fill="#000000" font-weight="bold">Contact sheet</text>
  <line x1="15" y1="23.3" x2="195" y2="23.3" stroke="#969696" stroke-width="0.2"/>
  <text x="15" y="28.463" font-family="Elms Sans" font-size="4.071" fill="#555555" font-style="italic">One picture is described in the template and repeated for every record in the data. Look</text>
  <text x="15" y="32.738" font-family="Elms Sans" font-size="4.071" fill="#555555" font-style="italic">for whole rows moving to the next page rather than a row being sliced across the break,</text>
  <text x="15" y="37.013" font-family="Elms Sans" font-size="4.071" fill="#555555" font-style="italic">for each picture keeping its proportions inside its cell, and for the records carrying no</text>
  <text x="15" y="41.288" font-family="Elms Sans" font-size="4.071" fill="#555555" font-style="italic">photograph leaving no empty frame behind.</text>
