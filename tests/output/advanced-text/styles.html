<!doctype html>
<html><head><meta charset="utf-8">
<title></title>
<style>
body{background:#525659;margin:0;padding:24px;font-family:sans-serif}
.page{background:#fff;margin:0 auto 24px;box-shadow:0 2px 12px rgba(0,0,0,.5);display:block;width:fit-content;max-width:100%;overflow:auto}
.page svg{display:block}
.num{color:#bbb;text-align:center;font-size:12px;margin-bottom:24px}
@page{size:210mm 297mm;margin:0}
@media print{body{background:#fff;margin:0;padding:0}.page{margin:0;box-shadow:none;break-after:page;page-break-after:always}.page:last-of-type{break-after:auto;page-break-after:auto}.num{display:none}}
</style></head><body>
<div class="page"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title> - page 1</title>
  <rect x="0" y="0" width="210" height="297" fill="#FFFFFF"/>
  <text x="15" y="21" font-family="Elms Sans" font-size="6.857" fill="#000000" font-weight="bold">One paragraph, several styles</text>
  <line x1="15" y1="23.3" x2="195" y2="23.3" stroke="#969696" stroke-width="0.2"/>
  <text x="15" y="28.463" font-family="Elms Sans" font-size="4.071" fill="#555555" font-style="italic">Bold, struck through and coloured inside a single sentence. Look for every piece sitting on</text>
  <text x="15" y="32.738" font-family="Elms Sans" font-size="4.071" fill="#555555" font-style="italic">one baseline rather than each being centred in its own height, for the pieces touching -</text>
  <text x="15" y="37.013" font-family="Elms Sans" font-size="4.071" fill="#555555" font-style="italic">the next starting exactly where the last one's measured width put it, not a millimetre</text>
  <text x="15" y="41.288" font-family="Elms Sans" font-size="4.071" fill="#555555" font-style="italic">short or proud - and for the line through crossing only the words that asked for it.</text>
  <text x="15" y="48.75" font-family="Elms Sans" font-size="4.286" fill="#000000">The </text>
  <text x="24.369" y="48.75" font-family="Elms Sans" font-size="4.286" fill="#000000" font-weight="bold">total</text>
  <text x="34.316" y="48.75" font-family="Elms Sans" font-size="4.286" fill="#000000"> is </text>
  <text x="40.787" y="48.75" font-family="Elms Sans" font-size="4.286" fill="#C0392B" text-decoration="line-through">cancelled</text>
  <text x="59.914" y="48.75" font-family="Elms Sans" font-size="4.286" fill="#000000"> and final.</text>
</svg>
</div>
<div class="num">page 1 / 1</div>
</body></html>
